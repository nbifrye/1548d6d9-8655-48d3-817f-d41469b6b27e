fapi-2-security-profile: "FAPI 2.0 の Authorization Code Flow で、PAR、PKCE、issuer identification、Client Authentication、sender-constrained Access Token がどの順序で組み合わされるかを整理します。"
oauth-security-bcp-rfc9700: "RFC 9700 が Authorization Code Grant に追加・更新する、redirect URI、CSRF、authorization code injection、PKCE のセキュリティ要件を整理します。"
scim-core-concepts: "User リソースの作成・検索・更新・削除を追いながら、SCIM 2.0 の schema と HTTP protocol の対応関係を整理します。"
webauthn-level-3-recommendation: "WebAuthn Level 3 の登録と認証の各 ceremony で、Relying Party が何を受け取り、どの値をどの順序で検証するかを整理します。"
dpop-proof-http-request: "DPoP proof JWT が HTTP request の情報と鍵の所持をどう結び付け、Resource Server が何を追加検証するかを整理します。"
dpop-server-provided-nonce: "Server が DPoP-Nonce を返し、Client がその値を次の DPoP proof の nonce claim に入れて request を再送する処理を追います。"
fapi-message-signing-authorization-request: "FAPI 2.0 Message Signing で Authorization Request を signed request object に入れ、PAR Endpoint で検証する流れを整理します。"
oauth-authorization-server-metadata: "issuer identifier から Authorization Server Metadata の URL を構成し、JSON metadata を取得して issuer を検証するまでを追います。"
oauth-device-authorization-grant: "Device Authorization Grant で device_code と user_code が別の経路を通り、承認と polling を経て Access Token を取得する流れを整理します。"
oauth-dynamic-client-registration: "Dynamic Client Registration の JSON client metadata と、成功時に返される client information の構造と HTTP 処理を整理します。"
oauth-dynamic-client-registration-management: "登録済み OAuth Client が Client Configuration Endpoint に Registration Access Token を提示し、GET / PUT / DELETE で登録情報を参照・更新・削除する処理を整理します。"
oauth-jwt-client-authentication: "JWT Client Authentication の form parameter、JWT Claims Set、Authorization Server が行う validation を RFC 7523 に沿って整理します。"
oauth-mtls-client-authentication: "RFC 8705 の2つの mutual-TLS Client Authentication method で、X.509 certificate を client_id に対応する credential として検証する方法を整理します。"
oauth-pkce-code-verifier-challenge: "PKCE の code_verifier 生成、code_challenge 導出、Authorization Request と Token Request への配置、Authorization Server の照合を追います。"
oauth-pushed-authorization-requests: "PAR で Authorization Request parameter を PAR Endpoint に POST し、返された request_uri を Authorization Endpoint で参照する2段階の流れを整理します。"
oauth-resource-indicators: "RFC 8707 の resource parameter が、requested Access Token の使用先となる Resource を Authorization Server にどう示すかを整理します。"
oauth-token-exchange: "Token Exchange で subject_token と token type を Token Endpoint に送り、新しい security token を受け取る request / response を整理します。"
oauth-token-introspection-active: "Token Introspection の request / response 形式と、active が表す状態、Authorization Server が行う適用可能な検査を整理します。"
oauth-token-revocation: "Token Revocation Endpoint に送る parameter、その配置、Authorization Server の検証と token 無効化、response の関係を整理します。"
oidc-id-token-validation: "Authorization Code Flow の Token Response で受け取る ID Tokenについて、Client が確認する Claim・署名・暗号化の要件を整理します。"
rar-authorization-details: "Rich Authorization Requests の authorization_details が細粒度の認可要求を JSON object の配列としてどう表現するかを整理します。"
scim-filter-expressions: "SCIM filter parameter の配置、filter expression の構造、比較・論理演算子、multi-valued attribute の評価とエラー処理を整理します。"
scim-group-membership: "SCIM Group.members と User.groups の役割を区別し、Group resource への PATCH で membership を更新する位置を整理します。"
scim-patch-add-remove-replace: "SCIM PATCH request の構造、path の対象指定、add・remove・replace の処理差、複数 operation の適用方法を整理します。"
scim-bulk-operations: "SCIM Bulk Endpoint に複数の resource operation を1つの BulkRequest として送り、bulkId による参照と operation ごとの BulkResponse を処理する方法を整理します。"
scim-sorting: "SCIM の sortBy / sortOrder を GET query または POST /.search に配置し、属性値と attribute type に従って検索結果を並べ替える規則を整理します。"
scim-index-based-pagination: "SCIM の startIndex / count を GET query または POST /.search に配置し、ListResponse の startIndex / itemsPerPage / totalResults を使ってページを取得する方法を整理します。"
scim-cursor-based-pagination: "RFC 9865 の cursor / count を GET または POST /.search に配置し、ListResponse の nextCursor / previousCursor を使って後続ページを取得する規則を整理します。"
scim-service-provider-configuration: "SCIM Client が /ServiceProviderConfig を GET し、PATCH、Bulk、filter、sort など Service Provider の対応機能を JSON configuration から確認する方法を整理します。"
scim-resource-types-discovery: "SCIM Client が /ResourceTypes を取得し、Service Provider が公開する Resource Type と endpoint、base schema、schema extension の対応を確認する方法を整理します。"
scim-schema-discovery: "SCIM Client が /Schemas から Schema resource を取得し、id と attributes から attribute の型・多値性・mutability などの定義を確認する方法を整理します。"
scim-enterprise-user-extension: "SCIM Enterprise User extension の schema URI と JSON container、employeeNumber などの組織属性、manager の参照構造を整理します。"
scim-password-writeonly: "SCIM User.password の writeOnly / returned=never の意味と、初期設定・変更、保存・転送、response で値を返さない規則を整理します。"
webauthn-conditional-mediation-authentication: "WebAuthn conditional mediation で capability check、credential discovery、ユーザー選択、assertion 取得までの認証フローを追います。"
webauthn-related-origin-requests: "WebAuthn Related Origin Requests の /.well-known/webauthn と、異なる origin から共通 RP ID を使う際の Client validation を整理します。"
jose-jws-jwe-jwk-jwks-overview: "JOSE の JWS・JWE・JWK・JWK Set が、それぞれ message protection と cryptographic key representation のどの役割を担うかを整理します。"
oauth-authorization-response-issuer: "RFC 9207 の Authorization Response iss parameter を Client が expected issuer identifier と照合し、不一致を拒否する処理を整理します。"
oauth-browser-application-architecture-patterns: "RFC 10017 の BFF、token-mediating backend、browser-based OAuth client の3構成を、Client の位置・token の保持・Resource Server への経路で区別します。"
oauth-jar-request-object: "JAR の Request Object が Authorization Request parameter を JWT Claims Set に保持し、request / request_uri で渡される構造を整理します。"
oauth-jwt-access-token-validation: "RFC 9068 の JWT Access Token について、typ、必須 Claims、Resource Server が行う validation requirements を整理します。"
oauth-mtls-certificate-bound-access-token: "Authorization Server が Access Token を Client certificate に結び付け、Resource Server が certificate と token binding を検証する流れを整理します。"
oauth-mtls-dpop-sender-constraint: "mTLS と DPoP の sender-constrained Access Token が何に binding され、Resource Server が proof of possession をどう確認するかを対比します。"
oauth-protected-resource-metadata: "Protected Resource の resource identifier から metadata URL を構成し、JSON metadata を取得して resource を検証するまでを追います。"
oidc-authorization-code-flow-id-token-role: "OpenID Connect Authorization Code Flow で ID Token が認証結果を Claims として RP に伝え、Subject Identifier を得る役割を整理します。"
oidc-userinfo-endpoint: "UserInfo Endpoint に Bearer Access Token を送り、Claims を受け取り、UserInfo Response の sub を ID Token の sub と照合する処理を整理します。"
oidc-provider-configuration-discovery: "既知の Issuer Identifier から OpenID Provider Configuration を取得し、metadata の issuer を照合するまでの Discovery 処理を整理します。"
