name: Editorial duplicate check
on:
  pull_request:
    paths:
      - "_posts/**"
      - "editorial-roadmap.md"
      - "OPERATIONS.md"
      - "scripts/check_duplicate_topics.py"
  push:
    branches: [main]
    paths:
      - "_posts/**"
jobs:
  duplicate-topics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check duplicate article topics
        run: python scripts/check_duplicate_topics.py
