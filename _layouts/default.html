<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "ja" }}">
  <head>
    {% include head.html %}
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("site-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    {% include header.html %}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}

    <button
      class="theme-toggle"
      type="button"
      aria-label="表示テーマを切り替える"
      aria-pressed="false"
      title="ライト / ダークテーマを切り替える">
      <span class="theme-toggle__icon" aria-hidden="true">◐</span>
      <span class="theme-toggle__label">Theme</span>
    </button>

    <script>
      (function () {
        var root = document.documentElement;
        var button = document.querySelector(".theme-toggle");
        if (!button) return;

        function systemIsDark() {
          return window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
        }

        function effectiveTheme() {
          return root.getAttribute("data-theme") || (systemIsDark() ? "dark" : "light");
        }

        function updateButton() {
          var current = effectiveTheme();
          button.setAttribute("aria-pressed", current === "dark" ? "true" : "false");
          button.setAttribute(
            "aria-label",
            current === "dark" ? "ライトテーマに切り替える" : "ダークテーマに切り替える"
          );
          button.querySelector(".theme-toggle__icon").textContent =
            current === "dark" ? "☀" : "☾";
        }

        button.addEventListener("click", function () {
          var next = effectiveTheme() === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try { localStorage.setItem("site-theme", next); } catch (e) {}
          updateButton();
          window.dispatchEvent(new CustomEvent("site-theme-change", { detail: next }));
        });

        if (window.matchMedia) {
          var media = window.matchMedia("(prefers-color-scheme: dark)");
          if (media.addEventListener) {
            media.addEventListener("change", function () {
              if (!root.getAttribute("data-theme")) updateButton();
            });
          }
        }

        updateButton();
      })();
    </script>
  </body>
</html>
